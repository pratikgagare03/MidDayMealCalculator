plugins {
    id 'com.android.application'
}

android {
    namespace 'in.curiosityworld.www.mdmcalci'
    compileSdk 34

    defaultConfig {
        applicationId "in.curiosityworld.www.mdmcalci"
        minSdkVersion 16
        targetSdkVersion 34
        versionCode 25
        versionName "2.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
